name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"
      - name: Check go.mod is tidy
        run: go mod tidy -diff
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
